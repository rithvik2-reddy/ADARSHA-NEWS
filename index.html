    <style>
      /* ── PREMIUM PRELOADER ── */
      #preloader {
        position: fixed; inset: 0;
        background: #0A0A10;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .preloader-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        animation: preloader-pulse 1.5s ease-in-out infinite;
      }
      .preloader-en {
        font-family: 'Inter', sans-serif;
        font-size: 2.4rem;
        font-weight: 900;
        color: #fff;
        letter-spacing: -1px;
      }
      .preloader-en span { color: #DC2626; }
      .preloader-te {
        font-family: 'Noto Sans Telugu', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: #94A3B8;
        letter-spacing: 2px;
      }
      .preloader-bar {
        width: 200px;
        height: 3px;
        background: #1E293B;
        border-radius: 10px;
        overflow: hidden;
      }
      .preloader-fill {
        height: 100%;
        background: linear-gradient(90deg, #DC2626, #EF4444, #DC2626);
        background-size: 200% 100%;
        border-radius: 10px;
        animation: preloader-slide 1.2s ease-in-out infinite;
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.98); }
      }
      @keyframes preloader-slide {
        0% { background-position: 200% 0; width: 0%; }
        50% { width: 80%; background-position: 0% 0; }
        100% { background-position: -200% 0; width: 100%; }
      }
      body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <!-- PREMIUM PRELOADER -->
    <div id="preloader">
      <div class="preloader-logo">
        <div class="preloader-en">ADARSHA <span>NEWS</span></div>
        <div class="preloader-te">ఆదర్శ వార్తలు</div>
      </div>
      <div class="preloader-bar"><div class="preloader-fill"></div></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.__hideSplash = function() {
        const el = document.getElementById('preloader');
        if (el) { el.classList.add('hidden'); setTimeout(() => el.remove(), 600); }
      };
      // Safety: always hide after 6s
      setTimeout(window.__hideSplash, 4000);
    </script>
  </body>
