name: 24/7 Cloud News Automation
on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server
          npm install

      - name: Fetch News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd server
          node cloud-fetch.js

      - name: Commit and Push News
        run: |
          git config --global user.name "Adarsha News Bot"
          git config --global user.email "bot@adarshanews.com"
          git add server/news.db
          git commit -m "Cloud Update: New articles added [$(date)]" || echo "No new news to commit"
          git push origin master
