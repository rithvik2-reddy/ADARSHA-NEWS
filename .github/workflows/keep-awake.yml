name: 24/7 Cloud News Automation
on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes on GitHub's cloud servers
  workflow_dispatch:          # Allow manual trigger from GitHub website

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Fetch & Rewrite News (AI on GitHub's Servers)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd server
          node cloud-fetch.js
        continue-on-error: true

      - name: Commit and Push Updated News JSON
        run: |
          git config --global user.name "Adarsha News Bot"
          git config --global user.email "bot@adarshanews.com"
          git add public/news-data.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "🤖 Auto Update: New articles [$(date '+%Y-%m-%d %H:%M')]"
            
            # Sync all potential production branches for Vercel
            git pull --rebase origin main || echo "Rebase failed"
            git push origin HEAD:main || git push origin HEAD:main --force || echo "Push to main failed"
            git push origin HEAD:master || git push origin HEAD:master --force || echo "Push to master failed"
            git push origin HEAD:production || git push origin HEAD:production --force || echo "Push to production failed"
            
            echo "✅ News data sync complete!"
          fi
